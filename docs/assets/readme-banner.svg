    <text x="48" y="205" font-size="38" font-weight="700" fill="#23262b">1投稿1.44MBしか使えない静寂のレトロSNS</text>
    <text x="48" y="264" font-size="23" fill="#4d524d">言葉も、ドット絵も、小さな音楽も。1 投稿をフロッピー 1 枚分に。</text>
