<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cfe9d8">
    <title>オフライン | floppy.io</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #cfe9d8; color: #174d35; font-family: monospace, sans-serif; line-height: 1.8; }
      main { width: 100%; max-width: 480px; border: 2px solid #174d35; box-shadow: 6px 6px 0 #174d35; padding: 32px; background: #fffdf1; }
      .label { font-size: 12px; letter-spacing: .12em; }
      h1 { font-size: 24px; line-height: 1.5; }
      a { display: inline-block; margin-top: 16px; padding: 10px 20px; background: #174d35; color: #fffdf1; text-decoration: none; }
      a:focus-visible { outline: 3px solid #c4661f; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">FLOPPY.IO / OFFLINE</p>
      <h1>接続を確認してください</h1>
      <p>現在、floppy.io に接続できません。投稿の閲覧・送信にはインターネット接続が必要です。</p>
      <p>通信が戻ったら、もう一度読み込んでください。</p>
      <a href="">もう一度読み込む</a>
    </main>
  </body>
</html>
